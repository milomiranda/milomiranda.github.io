<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garment Cards</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root {
    --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --color-text-primary: #111111;
    --color-text-secondary: #555555;
    --color-text-tertiary: #999999;
    --color-background-primary: #ffffff;
    --color-background-secondary: #f6f6f4;
    --color-border-secondary: #d8d8d8;
    --color-border-tertiary: #ebebeb;
    --border-radius-md: 8px;
    --border-radius-lg: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-sans); background: var(--color-background-secondary); min-height: 100vh; padding: 2rem 1.5rem; }
  .app { max-width: 1100px; margin: 0 auto; }
  .toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 12px; }
  .toolbar h1 { font-size: 17px; font-weight: 500; color: var(--color-text-primary); }
  .btn { font-size: 13px; font-weight: 500; padding: 7px 14px; border-radius: var(--border-radius-md); border: 0.5px solid var(--color-border-secondary); background: var(--color-background-primary); color: var(--color-text-primary); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  .btn:hover { background: var(--color-background-secondary); }
  .btn-primary { background: var(--color-text-primary); color: var(--color-background-primary); border-color: transparent; }
  .btn-primary:hover { opacity: 0.82; }
  .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
  .empty-state { text-align: center; padding: 3.5rem 1rem; color: var(--color-text-tertiary); font-size: 13px; grid-column: 1/-1; background: var(--color-background-primary); border-radius: var(--border-radius-lg); border: 0.5px solid var(--color-border-tertiary); }
  .look-card { background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); overflow: hidden; display: flex; flex-direction: column; }
  .card-header { padding: 11px 13px 9px; border-bottom: 0.5px solid var(--color-border-tertiary); }
  .card-brand { font-size: 14px; font-weight: 600; color: var(--color-text-primary); letter-spacing: 0.04em; text-transform: uppercase; }
  .card-meta { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 4px; align-items: center; }
  .card-photo { width: 100%; aspect-ratio: 3/4; background: var(--color-background-secondary); border-bottom: 0.5px solid var(--color-border-tertiary); display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative; overflow: hidden; }
  .card-photo img { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; }
  .card-photo .ph { display: flex; flex-direction: column; align-items: center; gap: 7px; color: var(--color-text-tertiary); font-size: 11px; }
  .card-photo input[type=file] { display: none; }
  .card-body { padding: 0 13px; display: flex; flex-direction: column; }
  .specs-row { display: flex; justify-content: space-between; border-top: 0.5px solid var(--color-border-tertiary); border-bottom: 0.5px solid var(--color-border-tertiary); padding: 8px 0 10px; gap: 4px; }
  .spec-item { display: flex; flex-direction: column; align-items: center; flex: 1; gap: 3px; }
  .spec-label { font-size: 9px; color: var(--color-text-tertiary); text-transform: uppercase; letter-spacing: 0.05em; line-height: 1; }
  .spec-val { font-size: 13px; font-weight: 700; color: var(--color-text-primary); line-height: 1; }
  .cond-badge { font-size: 10px; font-weight: 500; padding: 2px 7px; border-radius: 20px; white-space: nowrap; }
  .c-ds  { background:#0D0D0D;color:#C4FF00; }
  .c-nwt { background:#EAF3DE;color:#3B6D11;border:0.5px solid #97C459; }
  .c-exc { background:#E6F1FB;color:#185FA5;border:0.5px solid #85B7EB; }
  .c-vg  { background:#EEEDFE;color:#534AB7;border:0.5px solid #AFA9EC; }
  .c-gd  { background:#FAEEDA;color:#854F0B;border:0.5px solid #EF9F27; }
  .c-fr  { background:#FAECE7;color:#993C1D;border:0.5px solid #F0997B; }
  .c-p   { background:#F5F5F5;color:#666;border:0.5px solid #CCC; }
  .c-dam { background:#2D0000;color:#FF6B6B; }
  .story-block { font-size: 11px; color: var(--color-text-secondary); font-style: italic; line-height: 1.5; padding: 8px 0 6px; border-bottom: 0.5px solid var(--color-border-tertiary); }
  .qr-zone { margin: 8px 0 10px; border: 0.5px dashed var(--color-border-secondary); border-radius: var(--border-radius-md); padding: 8px 10px; display: flex; align-items: center; gap: 10px; }
  .qr-thumb { width: 44px; height: 44px; border: 0.5px solid var(--color-border-tertiary); border-radius: 4px; background: var(--color-background-secondary); flex-shrink: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; cursor: pointer; }
  .qr-thumb img { width: 100%; height: 100%; object-fit: contain; }
  .qr-cta { font-size: 10px; color: var(--color-text-secondary); font-style: italic; line-height: 1.5; }
  .qr-cta strong { display: block; font-size: 11px; color: var(--color-text-primary); font-style: normal; }
  .season-badge { font-size: 10px; font-weight: 500; padding: 2px 6px; border-radius: 20px; }
  .ss { background:#EAF3DE;color:#3B6D11;border:0.5px solid #97C459; }
  .aw { background:#E6F1FB;color:#185FA5;border:0.5px solid #85B7EB; }
  .resort { background:#FAEEDA;color:#854F0B;border:0.5px solid #EF9F27; }
  .prefall { background:#EEEDFE;color:#534AB7;border:0.5px solid #AFA9EC; }
  .card-footer { padding: 7px 12px; border-top: 0.5px solid var(--color-border-tertiary); display: flex; gap: 5px; justify-content: flex-end; }
  .btn-sm { font-size: 11px; padding: 4px 9px; border-radius: var(--border-radius-md); border: 0.5px solid var(--color-border-secondary); background: var(--color-background-primary); color: var(--color-text-secondary); cursor: pointer; display: inline-flex; align-items: center; gap: 3px; }
  .btn-sm:hover { background: var(--color-background-secondary); color: var(--color-text-primary); }
  .btn-sm.danger:hover { color: #a32d2d; border-color: #a32d2d; }
  .btn-sm.export { background: var(--color-text-primary); color: var(--color-background-primary); border-color: transparent; }
  .btn-sm.export:hover { opacity: 0.82; }
  .modal-bg { position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:1.5rem 1rem;overflow-y:auto; }
  .modal { background:var(--color-background-primary);border-radius:var(--border-radius-lg);border:0.5px solid var(--color-border-secondary);padding:1.5rem;width:100%;max-width:480px; }
  .modal h2 { font-size:15px;font-weight:500;margin-bottom:1.25rem;color:var(--color-text-primary); }
  .sdiv { font-size:10px;text-transform:uppercase;letter-spacing:0.06em;color:var(--color-text-tertiary);margin:14px 0 8px;padding-bottom:3px;border-bottom:0.5px solid var(--color-border-tertiary);grid-column:1/-1; }
  .fg { display:grid;grid-template-columns:1fr 1fr;gap:9px; }
  .g { display:flex;flex-direction:column;gap:3px; }
  .g.full { grid-column:1/-1; }
  .g label { font-size:11px;color:var(--color-text-secondary); }
  .g input,.g select,.g textarea { font-size:13px;padding:6px 9px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);color:var(--color-text-primary);font-family:var(--font-sans);width:100%; }
  .g textarea { resize:vertical;min-height:80px;line-height:1.6; }
  .mf { margin-top:1.2rem;display:flex;justify-content:flex-end;gap:8px; }
  .ai-btn { font-size:11px;padding:4px 9px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);background:var(--color-background-secondary);color:var(--color-text-secondary);cursor:pointer;display:inline-flex;align-items:center;gap:4px;margin-top:4px; }
  .ai-btn:hover { color:var(--color-text-primary); }
  .ai-spin { font-size:11px;color:var(--color-text-tertiary);font-style:italic;margin-top:4px; }
  .qr-upload-box { border:0.5px dashed var(--color-border-secondary);border-radius:var(--border-radius-md);padding:10px 12px;display:flex;align-items:center;gap:12px;cursor:pointer;margin-top:4px; }
  .qr-upload-box:hover { background:var(--color-background-secondary); }
  .qr-preview-box { width:52px;height:52px;border:0.5px solid var(--color-border-tertiary);border-radius:4px;background:var(--color-background-secondary);flex-shrink:0;display:flex;align-items:center;justify-content:center;overflow:hidden; }
  .qr-preview-box img { width:100%;height:100%;object-fit:contain; }
  .qr-upload-text strong { display:block;font-size:12px;color:var(--color-text-primary);margin-bottom:2px; }
  .qr-upload-text { font-size:11px;color:var(--color-text-secondary);line-height:1.5; }
  .hidden { display:none; }
</style>
</head>
<body>
<div class="app">
  <div class="toolbar">
    <h1><i class="ti ti-tag"></i> Garment cards</h1>
    <button class="btn btn-primary" onclick="openModal()"><i class="ti ti-plus"></i> Add garment</button>
  </div>
  <div class="cards-grid" id="grid"></div>
</div>

<div class="modal-bg hidden" id="modalBg">
  <div class="modal">
    <h2 id="modalTitle">New garment</h2>
    <div class="fg">
      <div class="sdiv">Garment</div>
      <div class="g full"><label>Brand *</label><input id="f-brand" placeholder="e.g. Maison Margiela"></div>
      <div class="g full"><label>Collection # (official)</label><input id="f-collnum" placeholder="e.g. Collection 6"></div>
      <div class="g"><label>Season</label>
        <select id="f-season">
          <option value="SS">SS — Spring/Summer</option>
          <option value="AW">AW — Autumn/Winter</option>
          <option value="Resort">Resort</option>
          <option value="Pre-Fall">Pre-Fall</option>
        </select>
      </div>
      <div class="g"><label>Year</label><input id="f-year" placeholder="e.g. 1998"></div>
      <div class="g"><label>Country of origin</label><input id="f-country" placeholder="e.g. France"></div>
      <div class="g"><label>Size</label><input id="f-size" placeholder="e.g. 38 / S"></div>
      <div class="g full"><label>Price</label><input id="f-price" placeholder="e.g. € 1,800"></div>
      <div class="sdiv">Condition</div>
      <div class="g full">
        <select id="f-condition">
          <option value="">— Select —</option>
          <option value="Deadstock">Deadstock</option>
          <option value="New with tags">New with tags</option>
          <option value="Excellent">Excellent</option>
          <option value="Very Good">Very Good</option>
          <option value="Good">Good</option>
          <option value="Fair">Fair</option>
          <option value="Poor">Poor</option>
          <option value="Damaged / For parts">Damaged / For parts</option>
        </select>
      </div>
      <div class="sdiv">Storytelling</div>
      <div class="g full">
        <label>Editorial description</label>
        <textarea id="f-story" placeholder="e.g. Tailored black wool coat from the AW 1998 collection…"></textarea>
        <button class="ai-btn" id="ai-btn" onclick="genStory()"><i class="ti ti-sparkles"></i> Generate with AI</button>
        <span class="ai-spin hidden" id="ai-spin">Writing editorial copy…</span>
      </div>
      <div class="sdiv">Vinted QR code</div>
      <div class="g full">
        <label>Upload your Vinted listing QR code</label>
        <div class="qr-upload-box" onclick="document.getElementById('modal-qr-input').click()">
          <div class="qr-preview-box" id="modal-qr-preview"><i class="ti ti-qrcode" style="font-size:20px;color:#999"></i></div>
          <div class="qr-upload-text"><strong id="modal-qr-label">Upload QR image</strong>Square PNG or JPG — redirects to your Vinted listing</div>
        </div>
        <input type="file" accept="image/*" id="modal-qr-input" class="hidden" onchange="handleModalQR(this)">
      </div>
    </div>
    <div class="mf">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveCard()">Save</button>
    </div>
  </div>
</div>

<script>
let cards = [];
let editingId = null;
let pendingQR = null;

const FIELDS = ['brand','collnum','season','year','country','size','price','condition','story'];
const SC = { SS:'ss', AW:'aw', Resort:'resort', 'Pre-Fall':'prefall' };
const COND_CLS = { 'Deadstock':'c-ds','New with tags':'c-nwt','Excellent':'c-exc','Very Good':'c-vg','Good':'c-gd','Fair':'c-fr','Poor':'c-p','Damaged / For parts':'c-dam' };

function openModal(id) {
  editingId = id || null;
  pendingQR = null;
  document.getElementById('modalTitle').textContent = id ? 'Edit garment' : 'New garment';
  const prev = id ? cards.find(x=>x.id===id) : {};
  FIELDS.forEach(f => { const el=document.getElementById('f-'+f); if(el) el.value=prev[f]||(f==='season'?'AW':''); });
  const qrPrev = document.getElementById('modal-qr-preview');
  const qrLbl  = document.getElementById('modal-qr-label');
  if (prev.qr) {
    qrPrev.innerHTML = `<img src="${prev.qr}" alt="QR">`;
    qrLbl.textContent = 'QR uploaded ✓';
    pendingQR = prev.qr;
  } else {
    qrPrev.innerHTML = `<i class="ti ti-qrcode" style="font-size:20px;color:#999"></i>`;
    qrLbl.textContent = 'Upload QR image';
  }
  document.getElementById('modal-qr-input').value = '';
  document.getElementById('modalBg').classList.remove('hidden');
}

function handleModalQR(input) {
  const file = input.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    pendingQR = e.target.result;
    document.getElementById('modal-qr-preview').innerHTML = `<img src="${pendingQR}" alt="QR">`;
    document.getElementById('modal-qr-label').textContent = 'QR uploaded ✓';
  };
  reader.readAsDataURL(file);
}

function closeModal() { document.getElementById('modalBg').classList.add('hidden'); editingId=null; pendingQR=null; }

function saveCard() {
  const brand = document.getElementById('f-brand').value.trim();
  if (!brand) { alert('Brand is required.'); return; }
  const prev = editingId ? cards.find(x=>x.id===editingId) : {};
  const d = { id: editingId||Date.now(), photo: prev.photo||null, qr: pendingQR!==null ? pendingQR : (prev.qr||null) };
  FIELDS.forEach(f => { const el=document.getElementById('f-'+f); d[f]=el?el.value.trim():''; });
  if (editingId) cards=cards.map(c=>c.id===editingId?d:c); else cards.push(d);
  render(); closeModal();
}

function del(id) { if(!confirm('Remove this card?')) return; cards=cards.filter(c=>c.id!==id); render(); }

function triggerPhoto(id) { document.getElementById('pi-'+id).click(); }
function handlePhoto(id, inp) {
  const f=inp.files[0]; if(!f) return;
  const r=new FileReader(); r.onload=e=>{cards=cards.map(c=>c.id===id?{...c,photo:e.target.result}:c);render();};
  r.readAsDataURL(f);
}

async function genStory() {
  const brand=document.getElementById('f-brand').value.trim();
  if (!brand) { alert('Add the brand name first.'); return; }
  document.getElementById('ai-btn').classList.add('hidden');
  document.getElementById('ai-spin').classList.remove('hidden');
  try {
    const res = await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1000,messages:[{role:'user',content:
        `Write a short editorial description for a vintage garment listed for resale at a luxury vintage fashion pop-up.\n\nBrand: ${brand}\nSeason: ${document.getElementById('f-season').value} ${document.getElementById('f-year').value}\nCollection: ${document.getElementById('f-collnum').value}\nCountry: ${document.getElementById('f-country').value}\nSize: ${document.getElementById('f-size').value}\nCondition: ${document.getElementById('f-condition').value}\n\n2-3 sentences max. Tone: editorial, precise, evocative like a high-end auction catalogue. No marketing fluff. Output only the description, no quotes or labels.`
      }]})
    });
    const data = await res.json();
    document.getElementById('f-story').value = (data.content?.find(b=>b.type==='text')?.text||'').trim();
  } catch(e) { alert('Could not generate. Try again.'); }
  document.getElementById('ai-btn').classList.remove('hidden');
  document.getElementById('ai-spin').classList.add('hidden');
}

function exportPDF(id) {
  const card = cards.find(x=>x.id===id); if(!card) return;
  if (typeof window.jspdf==='undefined') { alert('PDF library loading, try again.'); return; }
  const {jsPDF} = window.jspdf;
  const doc = new jsPDF({orientation:'portrait', unit:'pt', format:'a5'});
  const W=419.5, H=595.3, pad=10, r=(W-2*pad)/2, arch_cy=H-pad-r;

  doc.setFillColor(255,255,255); doc.rect(0,0,W,H,'F');

  // Tombstone
  doc.setDrawColor(17,17,17); doc.setLineWidth(1.0);
  doc.line(pad,pad,pad,arch_cy);
  doc.line(pad,pad,W-pad,pad);
  doc.line(W-pad,pad,W-pad,arch_cy);
  for(let i=0;i<60;i++){
    const a1=Math.PI*i/60,a2=Math.PI*(i+1)/60;
    doc.line(W/2+r*Math.cos(Math.PI-a1),H-(arch_cy+r*Math.sin(Math.PI-a1)),
             W/2+r*Math.cos(Math.PI-a2),H-(arch_cy+r*Math.sin(Math.PI-a2)));
  }
  doc.setDrawColor(17,17,17); doc.setLineWidth(0.5); doc.setFillColor(255,255,255);
  doc.circle(W/2, H-(arch_cy+r-16), 5.5, 'FD');

  // ── QR BAR — fixed at bottom ─────────────────────────────
  const bar_h=38, bar_y_rl=pad+4, bar_w=W-2*pad-12, bar_y_pdf=H-bar_y_rl-bar_h;
  doc.setLineDashPattern([1.5,2],0); doc.setDrawColor(187,187,187); doc.setLineWidth(0.5);
  doc.rect(pad+6,bar_y_pdf,bar_w,bar_h,'S');
  doc.setLineDashPattern([],0);
  const qr_sz=28, qr_x=pad+10, qr_y_rl=bar_y_rl+(bar_h-qr_sz)/2, qr_y_pdf=H-qr_y_rl-qr_sz;
  if(card.qr){
    try{doc.addImage(card.qr,'PNG',qr_x,qr_y_pdf,qr_sz,qr_sz);}
    catch(e){try{doc.addImage(card.qr,'JPEG',qr_x,qr_y_pdf,qr_sz,qr_sz);}catch(e2){}}
  } else {
    doc.setFillColor(239,239,239); doc.setDrawColor(200,200,200); doc.setLineWidth(0.4);
    doc.rect(qr_x,qr_y_pdf,qr_sz,qr_sz,'FD');
  }
  const cta_x=qr_x+qr_sz+8, cta_mid=bar_y_pdf+bar_h/2;
  doc.setFont('helvetica','italic'); doc.setFontSize(6.5); doc.setTextColor(17,17,17);
  doc.text('Maybe not now, but how about later?',cta_x,cta_mid-3);
  doc.setFont('helvetica','bold'); doc.setFontSize(8.5);
  doc.text('Buy it online \u2192',cta_x,cta_mid+9);

  // ── SPECS BAND ───────────────────────────────────────────
  const band_bot_rl=bar_y_rl+bar_h+6, band_hv=26, band_top_rl=band_bot_rl+band_hv;
  const band_bot_pdf=H-band_bot_rl, band_top_pdf=H-band_top_rl;
  doc.setDrawColor(204,204,204); doc.setLineWidth(0.35);
  doc.line(pad+14,band_bot_pdf+1,W-pad-14,band_bot_pdf+1);
  doc.line(pad+14,band_top_pdf-1,W-pad-14,band_top_pdf-1);
  const specItems=[['SIZE',card.size],['PRICE',card.price],['CONDITION',card.condition]].filter(r=>r[1]);
  if(specItems.length){
    const col_w=bar_w/specItems.length;
    specItems.forEach(([lbl,val],i)=>{
      const cx=pad+6+i*col_w+col_w/2;
      doc.setFont('helvetica','normal'); doc.setFontSize(6); doc.setTextColor(17,17,17);
      doc.text(lbl,cx,band_top_pdf+5,{align:'center'});
      doc.setFont('helvetica','bold'); doc.setFontSize(11);
      doc.text(val,cx,band_bot_pdf-4,{align:'center'});
    });
  }

  // ── STORY — centred, up to 4 lines, compact ──────────────
  const story_bot_rl=band_top_rl+6;
  let story_top_rl=story_bot_rl;
  if(card.story){
    doc.setFont('helvetica','italic'); doc.setFontSize(7); doc.setTextColor(17,17,17);
    const maxW=W-2*(pad+16);
    const lines=doc.splitTextToSize(card.story,maxW).slice(0,4);
    const lineH=9;
    lines.forEach((line,i)=>{
      doc.text(line,W/2,H-(story_bot_rl+6+i*lineH),{align:'center'});
    });
    story_top_rl=story_bot_rl+6+lines.length*lineH+4;
  }
  const rule2_rl=story_top_rl+3, rule2_pdf=H-rule2_rl;
  doc.setDrawColor(204,204,204); doc.setLineWidth(0.35);
  doc.line(pad+14,rule2_pdf,W-pad-14,rule2_pdf);

  // ── BRAND — tight to arch, auto-size ────────────────────
  const brand_y_rl=arch_cy-10, brand_y_pdf=H-brand_y_rl;
  const brandText=card.brand.toUpperCase();
  const maxBW=W-2*(pad+10);
  let bfs=20;
  doc.setFont('helvetica','bold');
  doc.setFontSize(bfs);
  while(bfs>7 && doc.getTextWidth(brandText)>maxBW){ bfs-=0.5; doc.setFontSize(bfs); }
  doc.setTextColor(17,17,17);
  doc.text(brandText,W/2,brand_y_pdf,{align:'center'});
  const subs=[];
  if(card.season||card.year) subs.push((card.season||'')+(card.year?' '+card.year:''));
  if(card.country) subs.push(card.country);
  if(subs.length){
    doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(17,17,17);
    doc.text(subs.join('  \u00b7  '),W/2,brand_y_pdf+14,{align:'center'});
  }
  const rule_bb_rl=brand_y_rl-26, rule_bb_pdf=H-rule_bb_rl;
  doc.setDrawColor(204,204,204); doc.setLineWidth(0.35);
  doc.line(pad+14,rule_bb_pdf,W-pad-14,rule_bb_pdf);

  // ── PHOTO — all space between brand rule and story rule ──
  let ph=rule_bb_rl-3-(rule2_rl+3), pw=Math.round(ph*3/4);
  const mpw=W-2*pad-8; if(pw>mpw){pw=mpw;ph=Math.round(pw*4/3);}
  const px=(W-pw)/2, py_pdf=H-(rule_bb_rl-3);
  if(card.photo){
    try{doc.addImage(card.photo,'JPEG',px,py_pdf,pw,ph);}
    catch(e){try{doc.addImage(card.photo,'PNG',px,py_pdf,pw,ph);}catch(e2){}}
  } else {
    doc.setFillColor(244,244,244); doc.setDrawColor(187,187,187); doc.setLineWidth(0.5);
    doc.rect(px,py_pdf,pw,ph,'FD');
    doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(187,187,187);
    doc.text('runway reference',W/2,py_pdf+ph/2,{align:'center'});
  }

  doc.save((card.brand+'_'+card.season+(card.year||'')+'.pdf').replace(/\s+/g,'_'));
}

function render() {
  const grid=document.getElementById('grid');
  grid.innerHTML='';
  if(!cards.length){
    grid.innerHTML='<div class="empty-state"><i class="ti ti-hanger" style="font-size:30px;display:block;margin-bottom:8px"></i>No garments yet. Add your first card.</div>';
    return;
  }
  cards.forEach(c=>{
    const sc=SC[c.season]||'ss';
    const ck=COND_CLS[c.condition]||'';
    const div=document.createElement('div');
    div.className='look-card';
    div.innerHTML=`
      <div class="card-header">
        <div class="card-brand">${c.brand}</div>
        <div class="card-meta">
          ${c.season||c.year?`<span class="season-badge ${sc}">${c.season||''}${c.year?' '+c.year:''}</span>`:''}
          ${c.collnum?`<span style="font-size:10px;color:#999">${c.collnum}</span>`:''}
          ${c.country?`<span style="font-size:10px;color:#999">· ${c.country}</span>`:''}
        </div>
      </div>
      <div class="card-photo" onclick="triggerPhoto(${c.id})">
        ${c.photo?`<img src="${c.photo}" alt="">`:`<div class="ph"><i class="ti ti-camera" style="font-size:24px"></i><span>Add runway photo</span></div>`}
        <input type="file" accept="image/*" id="pi-${c.id}" onchange="handlePhoto(${c.id},this)">
      </div>
      <div class="card-body">
        <div class="specs-row">
          ${c.size?`<div class="spec-item"><span class="spec-label">Size</span><span class="spec-val">${c.size}</span></div>`:''}
          ${c.price?`<div class="spec-item"><span class="spec-label">Price</span><span class="spec-val">${c.price}</span></div>`:''}
          ${c.condition?`<div class="spec-item"><span class="spec-label">Condition</span><span class="cond-badge ${ck}" style="margin-top:2px">${c.condition}</span></div>`:''}
        </div>
        ${c.story?`<div class="story-block">${c.story}</div>`:''}
        <div class="qr-zone">
          <div class="qr-thumb" onclick="openModal(${c.id})" title="Edit to update QR">
            ${c.qr?`<img src="${c.qr}" alt="QR">`:`<i class="ti ti-qrcode" style="font-size:18px;color:#999"></i>`}
          </div>
          <div class="qr-cta">Maybe not now, but how about later?<strong>Buy it online →</strong></div>
        </div>
      </div>
      <div class="card-footer">
        <button class="btn-sm" onclick="openModal(${c.id})"><i class="ti ti-edit"></i> Edit</button>
        <button class="btn-sm export" onclick="exportPDF(${c.id})"><i class="ti ti-download"></i> Export PDF</button>
        <button class="btn-sm danger" onclick="del(${c.id})"><i class="ti ti-trash"></i></button>
      </div>`;
    grid.appendChild(div);
  });
}

render();
document.getElementById('modalBg').addEventListener('click',function(e){if(e.target===this)closeModal();});
</script>
