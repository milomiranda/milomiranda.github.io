<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Backstage — Look Card Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f6f6f4;
    --card-bg: #ffffff;
    --accent: #c5fe00;
    --text: #111111;
    --muted: #aaaaaa;
    --border: #ebebeb;
    --card-shadow: 0 2px 16px rgba(0,0,0,0.05);
    --font: 'DM Sans', sans-serif;
    --radius-card: 20px;
    --radius-input: 10px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    min-height: 100vh;
  }

  /* ── Header ── */
  .site-header {
    padding: 48px 40px 0;
    max-width: 1200px;
    margin: 0 auto;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--accent);
    color: var(--text);
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 5px 14px;
    border-radius: 999px;
    margin-bottom: 18px;
  }

  .site-header h1 {
    font-size: clamp(32px, 5vw, 52px);
    font-weight: 800;
    letter-spacing: -0.04em;
    line-height: 1.05;
    color: var(--text);
  }

  .site-header p {
    margin-top: 10px;
    color: var(--muted);
    font-size: 15px;
    font-weight: 400;
  }

  .header-row {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 20px;
    flex-wrap: wrap;
    margin-top: 32px;
  }

  /* ── Buttons ── */
  .btn-primary {
    background: var(--accent);
    color: var(--text);
    border: none;
    border-radius: var(--radius-input);
    font-family: var(--font);
    font-size: 14px;
    font-weight: 800;
    padding: 11px 22px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    transition: opacity 0.15s;
    white-space: nowrap;
  }
  .btn-primary:hover { opacity: 0.85; }

  .btn-ghost {
    background: var(--card-bg);
    color: var(--text);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-input);
    font-family: var(--font);
    font-size: 13px;
    font-weight: 600;
    padding: 8px 16px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: border-color 0.15s;
  }
  .btn-ghost:hover { border-color: #ccc; }

  .btn-icon {
    background: none;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    font-family: var(--font);
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    padding: 5px 10px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    transition: color 0.15s, border-color 0.15s;
  }
  .btn-icon:hover { color: var(--text); border-color: #bbb; }
  .btn-icon.danger:hover { color: #c0392b; border-color: #c0392b; }

  /* ── Main layout ── */
  .main {
    max-width: 1200px;
    margin: 0 auto;
    padding: 32px 40px 80px;
  }

  /* ── Cards grid ── */
  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
    margin-top: 12px;
  }

  /* ── Look card ── */
  .look-card {
    background: var(--card-bg);
    border: 2px solid var(--border);
    border-radius: var(--radius-card);
    box-shadow: var(--card-shadow);
    display: flex;
    flex-direction: column;
    gap: 0;
    overflow: hidden;
    animation: fadeUp 0.35s ease both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .card-head {
    padding: 20px 22px 14px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
  }

  .card-icon {
    width: 32px;
    height: 32px;
    background: var(--accent);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    flex-shrink: 0;
    margin-bottom: 8px;
  }

  .card-brand-name {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--text);
  }

  .card-meta-row {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
    margin-top: 5px;
    align-items: center;
  }

  .card-look-pill {
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    background: var(--bg);
    border: 1.5px solid var(--border);
    border-radius: 999px;
    padding: 3px 10px;
    color: var(--muted);
    white-space: nowrap;
  }

  /* ── Photo ── */
  .card-photo {
    width: 100%;
    aspect-ratio: 3/4;
    background: var(--bg);
    border-top: 2px solid var(--border);
    border-bottom: 2px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }
  .card-photo img { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; }
  .card-photo input[type=file] { display: none; }
  .photo-placeholder {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    color: var(--muted);
    font-size: 12px;
    font-weight: 500;
  }
  .photo-placeholder i { font-size: 28px; }

  /* ── Card body ── */
  .card-body {
    padding: 16px 22px;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .field-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }

  .field-label {
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    flex-shrink: 0;
  }

  .field-val {
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    text-align: right;
  }

  .story-block {
    margin-top: 4px;
    padding-top: 10px;
    border-top: 1.5px solid var(--border);
  }

  .story-text {
    font-size: 11.5px;
    color: #555;
    font-style: italic;
    line-height: 1.65;
    margin-top: 4px;
  }

  /* ── Card footer ── */
  .card-footer {
    padding: 12px 22px 18px;
    display: flex;
    gap: 6px;
    justify-content: flex-end;
  }

  /* ── Season + condition badges ── */
  .season-badge {
    font-size: 10px;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: 999px;
    letter-spacing: 0.04em;
  }
  .ss   { background: #EAF3DE; color: #3B6D11; border: 1.5px solid #97C459; }
  .aw   { background: #E6F1FB; color: #185FA5; border: 1.5px solid #85B7EB; }
  .resort  { background: #FAEEDA; color: #854F0B; border: 1.5px solid #EF9F27; }
  .prefall { background: #EEEDFE; color: #534AB7; border: 1.5px solid #AFA9EC; }

  .cond-badge { font-size: 10px; font-weight: 700; padding: 3px 10px; border-radius: 999px; }
  .cond-deadstock { background: #111; color: var(--accent); }
  .cond-nwt      { background: #EAF3DE; color: #3B6D11; border: 1.5px solid #97C459; }
  .cond-excellent { background: #E6F1FB; color: #185FA5; border: 1.5px solid #85B7EB; }
  .cond-verygood  { background: #EEEDFE; color: #534AB7; border: 1.5px solid #AFA9EC; }
  .cond-good      { background: #FAEEDA; color: #854F0B; border: 1.5px solid #EF9F27; }
  .cond-fair      { background: #FAECE7; color: #993C1D; border: 1.5px solid #F0997B; }

  /* ── Empty state ── */
  .empty-state {
    grid-column: 1 / -1;
    text-align: center;
    padding: 64px 20px;
    color: var(--muted);
  }
  .empty-state i { font-size: 40px; display: block; margin-bottom: 12px; }
  .empty-state p { font-size: 15px; font-weight: 500; }

  /* ── Modal ── */
  .modal-bg {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 200;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 40px 20px;
    overflow-y: auto;
    backdrop-filter: blur(2px);
  }

  .modal {
    background: var(--card-bg);
    border: 2px solid var(--border);
    border-radius: var(--radius-card);
    box-shadow: 0 12px 48px rgba(0,0,0,0.12);
    padding: 32px;
    width: 100%;
    max-width: 540px;
  }

  .modal-title-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 28px;
  }

  .modal-icon {
    width: 40px;
    height: 40px;
    background: var(--accent);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }

  .modal h2 {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.03em;
  }

  .section-label {
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 22px 0 12px;
    grid-column: 1 / -1;
  }

  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .form-group {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .form-group.full { grid-column: 1 / -1; }

  .form-group label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .form-group input,
  .form-group select,
  .form-group textarea {
    font-family: var(--font);
    font-size: 13px;
    font-weight: 500;
    padding: 9px 12px;
    border-radius: var(--radius-input);
    border: 1.5px solid var(--border);
    background: #fafafa;
    color: var(--text);
    width: 100%;
    transition: border-color 0.15s;
    outline: none;
  }
  .form-group input:focus,
  .form-group select:focus,
  .form-group textarea:focus {
    border-color: #aaa;
    background: #fff;
  }
  .form-group textarea { resize: vertical; min-height: 90px; line-height: 1.6; }

  .ai-btn {
    margin-top: 6px;
    background: var(--accent);
    border: none;
    border-radius: 8px;
    font-family: var(--font);
    font-size: 12px;
    font-weight: 800;
    color: var(--text);
    padding: 6px 14px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    transition: opacity 0.15s;
  }
  .ai-btn:hover { opacity: 0.8; }

  .ai-loading {
    font-size: 11px;
    color: var(--muted);
    font-style: italic;
    margin-top: 6px;
    display: none;
  }

  .modal-footer {
    margin-top: 28px;
    display: flex;
    justify-content: flex-end;
    gap: 10px;
  }

  /* ── Summary banner ── */
  .summary-banner {
    background: var(--accent);
    border-radius: var(--radius-card);
    padding: 20px 28px;
    margin-bottom: 28px;
    box-shadow: 0 4px 24px rgba(197,254,0,0.35);
    display: flex;
    gap: 32px;
    flex-wrap: wrap;
    align-items: center;
  }
  .banner-stat { display: flex; flex-direction: column; gap: 2px; }
  .banner-num {
    font-family: monospace;
    font-size: 32px;
    font-weight: 800;
    color: var(--text);
    line-height: 1;
  }
  .banner-label {
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: rgba(0,0,0,0.5);
  }
  .banner-divider { width: 1px; height: 40px; background: rgba(0,0,0,0.15); }

  /* ── Footer ── */
  footer {
    text-align: center;
    padding: 32px 20px;
    font-size: 12px;
    color: var(--muted);
    font-weight: 500;
  }

  .hidden { display: none !important; }

  @media (max-width: 600px) {
    .site-header, .main { padding-left: 20px; padding-right: 20px; }
    .form-grid { grid-template-columns: 1fr; }
    .form-group.full { grid-column: 1; }
    .section-label { grid-column: 1; }
    .modal { padding: 24px 20px; }
    .summary-banner { gap: 20px; }
  }
</style>
</head>
<body>

<header class="site-header">
  <div class="badge"><i class="ti ti-hanger"></i> Backstage</div>
  <h1>Look Card Builder</h1>
  <p>Archive and present your runway pieces with precision.</p>
  <div class="header-row">
    <div></div>
    <button class="btn-primary" onclick="openModal()">
      <i class="ti ti-plus"></i> Add look
    </button>
  </div>
</header>

<main class="main">

  <div class="summary-banner hidden" id="summaryBanner">
    <div class="banner-stat">
      <span class="banner-num" id="bannerCount">0</span>
      <span class="banner-label">Look cards</span>
    </div>
    <div class="banner-divider"></div>
    <div class="banner-stat">
      <span class="banner-num" id="bannerBrands">0</span>
      <span class="banner-label">Brands</span>
    </div>
    <div class="banner-divider"></div>
    <div class="banner-stat">
      <span class="banner-num" id="bannerSeasons">0</span>
      <span class="banner-label">Seasons</span>
    </div>
  </div>

  <div class="cards-grid" id="cardsGrid"></div>

</main>

<!-- Modal -->
<div class="modal-bg hidden" id="modalBg">
  <div class="modal">
    <div class="modal-title-row">
      <div class="modal-icon"><i class="ti ti-hanger"></i></div>
      <h2 id="modalTitle">New look</h2>
    </div>

    <div class="form-grid">

      <div class="section-label">Identity</div>

      <div class="form-group full">
        <label>Brand name *</label>
        <input type="text" id="f-brand" placeholder="e.g. Maison Margiela">
      </div>
      <div class="form-group">
        <label>Look #</label>
        <input type="text" id="f-look" placeholder="e.g. 18">
      </div>
      <div class="form-group">
        <label>Collection #</label>
        <input type="text" id="f-collnum" placeholder="e.g. Collection 6">
      </div>
      <div class="form-group">
        <label>Season</label>
        <select id="f-season">
          <option value="SS">SS — Spring/Summer</option>
          <option value="AW">AW — Autumn/Winter</option>
          <option value="Resort">Resort</option>
          <option value="Pre-Fall">Pre-Fall</option>
        </select>
      </div>
      <div class="form-group">
        <label>Year</label>
        <input type="text" id="f-year" placeholder="e.g. 1998">
      </div>
      <div class="form-group">
        <label>Country of origin</label>
        <input type="text" id="f-country" placeholder="e.g. France">
      </div>
      <div class="form-group">
        <label>Model name</label>
        <input type="text" id="f-model" placeholder="e.g. Amara Nwosu">
      </div>

      <div class="section-label">Garment</div>

      <div class="form-group">
        <label>Size</label>
        <input type="text" id="f-size" placeholder="e.g. 36 / XS">
      </div>
      <div class="form-group">
        <label>Retail price</label>
        <input type="text" id="f-price" placeholder="e.g. €2,400">
      </div>
      <div class="form-group full">
        <label>Accessories (shoes, bag, jewelry)</label>
        <input type="text" id="f-accessories" placeholder="e.g. Leather mules 39, gold chain bag">
      </div>
      <div class="form-group full">
        <label>Hair &amp; makeup ref</label>
        <input type="text" id="f-hmu" placeholder="e.g. Slicked back, nude lip">
      </div>

      <div class="section-label">Condition</div>

      <div class="form-group full">
        <label>Estado de conservación</label>
        <select id="f-condition">
          <option value="">— Select —</option>
          <option value="Deadstock">Deadstock</option>
          <option value="New with tags">New with tags</option>
          <option value="Excellent">Excellent</option>
          <option value="Very Good">Very Good</option>
          <option value="Good">Good</option>
          <option value="Fair">Fair</option>
        </select>
      </div>

      <div class="section-label">Storytelling</div>

      <div class="form-group full">
        <label>Editorial description</label>
        <textarea id="f-story" placeholder="e.g. Tailored black wool coat from the Fall/Winter 1998 collection by Martin Margiela…"></textarea>
        <button class="ai-btn" onclick="generateStorytelling()" id="ai-btn">
          <i class="ti ti-sparkles"></i> Generate with AI
        </button>
        <span class="ai-loading" id="ai-loading">Writing editorial copy…</span>
      </div>

      <div class="section-label">Backstage notes</div>

      <div class="form-group full">
        <label>Dresser / stylist notes</label>
        <textarea id="f-notes" placeholder="e.g. Zipper at back — do last, model changes in under 60s"></textarea>
      </div>

    </div>

    <div class="modal-footer">
      <button class="btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn-primary" onclick="saveCard()">Save look</button>
    </div>
  </div>
</div>

<footer>Built by Emilio Miranda Escamilla</footer>

<script>
let cards = JSON.parse(localStorage.getItem('backstage_cards_v3') || '[]');
let editingId = null;

const conditionClass = {
  'Deadstock': 'cond-deadstock',
  'New with tags': 'cond-nwt',
  'Excellent': 'cond-excellent',
  'Very Good': 'cond-verygood',
  'Good': 'cond-good',
  'Fair': 'cond-fair'
};

const seasonClass = { 'SS':'ss','AW':'aw','Resort':'resort','Pre-Fall':'prefall' };

const FIELDS = ['brand','look','collnum','season','year','country','model','size','price','accessories','hmu','condition','story','notes'];

function persist() {
  localStorage.setItem('backstage_cards_v3', JSON.stringify(cards));
}

function openModal(id) {
  editingId = id || null;
  document.getElementById('modalTitle').textContent = id ? 'Edit look' : 'New look';
  if (id) {
    const c = cards.find(x => x.id === id);
    FIELDS.forEach(f => { const el = document.getElementById('f-'+f); if (el) el.value = c[f] || ''; });
  } else {
    FIELDS.forEach(f => { const el = document.getElementById('f-'+f); if (el) el.value = ''; });
    document.getElementById('f-season').value = 'AW';
  }
  document.getElementById('modalBg').classList.remove('hidden');
  document.getElementById('f-brand').focus();
}

function closeModal() {
  document.getElementById('modalBg').classList.add('hidden');
  editingId = null;
}

function saveCard() {
  const brand = document.getElementById('f-brand').value.trim();
  if (!brand) { alert('Brand name is required.'); return; }
  const data = { id: editingId || Date.now(), photo: editingId ? (cards.find(x=>x.id===editingId)?.photo||null) : null };
  FIELDS.forEach(f => { const el = document.getElementById('f-'+f); data[f] = el ? el.value.trim() : ''; });
  if (editingId) { cards = cards.map(c => c.id === editingId ? data : c); }
  else { cards.push(data); }
  persist();
  renderCards();
  closeModal();
}

function deleteCard(id) {
  if (!confirm('Remove this look card?')) return;
  cards = cards.filter(c => c.id !== id);
  persist();
  renderCards();
}

function triggerPhotoUpload(id) { document.getElementById('photo-input-'+id).click(); }

function handlePhoto(id, input) {
  const file = input.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    cards = cards.map(c => c.id===id ? {...c, photo: e.target.result} : c);
    persist();
    renderCards();
  };
  reader.readAsDataURL(file);
}

async function generateStorytelling() {
  const brand = document.getElementById('f-brand').value.trim();
  const season = document.getElementById('f-season').value;
  const year = document.getElementById('f-year').value.trim();
  const look = document.getElementById('f-look').value.trim();
  const collnum = document.getElementById('f-collnum').value.trim();
  const country = document.getElementById('f-country').value.trim();
  const size = document.getElementById('f-size').value.trim();
  const condition = document.getElementById('f-condition').value;

  if (!brand) { alert('Add the brand name first.'); return; }

  document.getElementById('ai-btn').classList.add('hidden');
  document.getElementById('ai-loading').style.display = 'block';

  const prompt = `Write a short, elegant editorial description for a vintage fashion piece for a look card used at a luxury vintage fashion sale or showroom.
Details:
- Brand: ${brand}
- Season: ${season} ${year}
${collnum ? '- Official collection: ' + collnum : ''}
${look ? '- Look number: ' + look : ''}
${country ? '- Country of origin: ' + country : ''}
${size ? '- Size: ' + size : ''}
${condition ? '- Condition: ' + condition : ''}

Write 2-4 sentences max. Tone: editorial, precise, evocative — like a high-end auction house or archive store. Mention the season, any signature design codes of the house if known, and what makes it collectible. No marketing fluff. Output only the description text, no quotes, no labels.`;

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 1000,
        messages: [{ role: 'user', content: prompt }]
      })
    });
    const data = await res.json();
    const text = data.content?.find(b => b.type === 'text')?.text || '';
    document.getElementById('f-story').value = text.trim();
  } catch(e) {
    alert('Could not generate. Try again.');
  }

  document.getElementById('ai-btn').classList.remove('hidden');
  document.getElementById('ai-loading').style.display = 'none';
}

function exportPDF(id) {
  const c = cards.find(x => x.id === id);
  if (!c) return;
  if (typeof window.jspdf === 'undefined') { alert('PDF library still loading, try again in a moment.'); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a5' });
  const W = 148, H = 210;
  doc.setFillColor(255,255,255); doc.rect(0,0,W,H,'F');
  doc.setDrawColor(235,235,235); doc.rect(5,5,W-10,H-10,'S');

  doc.setFont('helvetica','bold'); doc.setFontSize(15); doc.setTextColor(17,17,17);
  doc.text(c.brand.toUpperCase(), W/2, 16, { align: 'center' });

  let subY = 22;
  const subs = [];
  if (c.collnum) subs.push(c.collnum);
  if (c.season || c.year) subs.push((c.season||'') + (c.year ? ' '+c.year : ''));
  if (subs.length) {
    doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(120,120,120);
    doc.text(subs.join('  ·  '), W/2, subY, { align: 'center' });
    subY += 4;
  }
  if (c.look) {
    doc.setFontSize(8); doc.setTextColor(160,160,160);
    doc.text('Look ' + c.look, W/2, subY+1, { align: 'center' });
    subY += 5;
  }

  let photoEndY = subY + 4;
  if (c.photo) {
    try {
      const imgW = 55, imgH = 73, imgX = (W-imgW)/2;
      doc.addImage(c.photo, 'JPEG', imgX, photoEndY, imgW, imgH);
      photoEndY += imgH + 5;
    } catch(e) { photoEndY += 5; }
  } else {
    doc.setDrawColor(210,210,210); doc.setFillColor(248,248,248);
    doc.rect(46, photoEndY, 56, 72, 'FD');
    doc.setFontSize(7); doc.setTextColor(190,190,190);
    doc.text('photo', W/2, photoEndY+38, { align: 'center' });
    photoEndY += 76;
  }

  doc.setDrawColor(230,230,230); doc.line(10, photoEndY, W-10, photoEndY); photoEndY += 5;

  const rows = [
    ['Size', c.size], ['Price', c.price], ['Country', c.country],
    ['Condition', c.condition], ['Model', c.model],
    ['Accessories', c.accessories], ['Hair & MU', c.hmu]
  ].filter(r => r[1]);

  let y = photoEndY;
  rows.forEach(([label, val]) => {
    if (y > H - 30) return;
    doc.setFont('helvetica','bold'); doc.setFontSize(6.5); doc.setTextColor(140,140,140);
    doc.text(label.toUpperCase(), 10, y);
    doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(25,25,25);
    const lines = doc.splitTextToSize(val, W-52);
    doc.text(lines[0], W-10, y, { align: 'right' });
    y += 5.5;
  });

  if (c.story && y < H - 20) {
    doc.setDrawColor(220,220,220); doc.line(10, y+2, W-10, y+2); y += 7;
    doc.setFont('helvetica','bolditalic'); doc.setFontSize(6.5); doc.setTextColor(120,120,120);
    doc.text('STORYTELLING', 10, y); y += 4;
    doc.setFont('helvetica','italic'); doc.setFontSize(7); doc.setTextColor(60,60,60);
    const storyLines = doc.splitTextToSize(c.story, W-20);
    storyLines.slice(0, 6).forEach(line => { if (y < H-12) { doc.text(line, 10, y); y += 4.5; } });
  }

  doc.setFont('helvetica','normal'); doc.setFontSize(6); doc.setTextColor(200,200,200);
  doc.text('backstage', W/2, H-6, { align: 'center' });

  doc.save((c.brand+'_look'+(c.look||'')+'_'+c.season+(c.year||'')+'.pdf').replace(/\s+/g,'_'));
}

function updateBanner() {
  const banner = document.getElementById('summaryBanner');
  if (!cards.length) { banner.classList.add('hidden'); return; }
  banner.classList.remove('hidden');
  document.getElementById('bannerCount').textContent = cards.length;
  document.getElementById('bannerBrands').textContent = new Set(cards.map(c => c.brand)).size;
  document.getElementById('bannerSeasons').textContent = new Set(cards.map(c => (c.season||'')+(c.year||'')).filter(Boolean)).size;
}

function renderCards() {
  const grid = document.getElementById('cardsGrid');
  grid.innerHTML = '';
  updateBanner();

  if (!cards.length) {
    grid.innerHTML = `
      <div class="empty-state">
        <i class="ti ti-hanger"></i>
        <p>No looks yet. Add your first card.</p>
      </div>`;
    return;
  }

  cards.forEach((c, idx) => {
    const sc = seasonClass[c.season] || 'ss';
    const cc = conditionClass[c.condition] || '';
    const div = document.createElement('div');
    div.className = 'look-card';
    div.style.animationDelay = (idx * 0.05) + 's';
    div.innerHTML = `
      <div class="card-head">
        <div>
          <div class="card-icon"><i class="ti ti-hanger"></i></div>
          <div class="card-brand-name">${c.brand}</div>
          <div class="card-meta-row">
            ${c.season||c.year ? `<span class="season-badge ${sc}">${c.season||''}${c.year?' '+c.year:''}</span>` : ''}
            ${c.collnum ? `<span style="font-size:11px;color:var(--muted)">${c.collnum}</span>` : ''}
            ${c.country ? `<span style="font-size:11px;color:var(--muted)">· ${c.country}</span>` : ''}
          </div>
        </div>
        ${c.look ? `<span class="card-look-pill">Look ${c.look}</span>` : ''}
      </div>
      <div class="card-photo" onclick="triggerPhotoUpload(${c.id})">
        ${c.photo
          ? `<img src="${c.photo}" alt="Look photo">`
          : `<div class="photo-placeholder"><i class="ti ti-camera"></i><span>Tap to add photo</span></div>`}
        <input type="file" accept="image/*" id="photo-input-${c.id}" onchange="handlePhoto(${c.id},this)">
      </div>
      <div class="card-body">
        ${c.condition ? `<div class="field-row"><span class="field-label">Condition</span><span class="cond-badge ${cc}">${c.condition}</span></div>` : ''}
        ${c.size ? `<div class="field-row"><span class="field-label">Size</span><span class="field-val">${c.size}</span></div>` : ''}
        ${c.price ? `<div class="field-row"><span class="field-label">Price</span><span class="field-val" style="font-weight:700">${c.price}</span></div>` : ''}
        ${c.model ? `<div class="field-row"><span class="field-label">Model</span><span class="field-val">${c.model}</span></div>` : ''}
        ${c.accessories ? `<div class="field-row"><span class="field-label">Accessories</span><span class="field-val" style="font-size:11px">${c.accessories}</span></div>` : ''}
        ${c.hmu ? `<div class="field-row"><span class="field-label">Hair & MU</span><span class="field-val" style="font-size:11px">${c.hmu}</span></div>` : ''}
        ${c.notes ? `<div class="story-block"><div class="field-label">Notes</div><div class="story-text" style="font-style:normal">${c.notes}</div></div>` : ''}
        ${c.story ? `<div class="story-block"><div class="field-label">Storytelling</div><div class="story-text">${c.story}</div></div>` : ''}
      </div>
      <div class="card-footer">
        <button class="btn-icon" onclick="openModal(${c.id})"><i class="ti ti-edit"></i> Edit</button>
        <button class="btn-icon" onclick="exportPDF(${c.id})"><i class="ti ti-download"></i> PDF</button>
        <button class="btn-icon danger" onclick="deleteCard(${c.id})"><i class="ti ti-trash"></i></button>
      </div>`;
    grid.appendChild(div);
  });
}

renderCards();

document.getElementById('modalBg').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});
</script>
</body>
</html>
