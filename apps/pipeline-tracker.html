<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leadlist Overview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700;9..40,900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f6f4; --card:#ffffff; --accent:#c5fe00; --accent-ink:#3a4400;
    --text:#14140f; --muted:#767368; --border:#e6e5e0;
    --fresh:#5c8a00; --warm:#b9791a; --stale:#c8402f; --none:#9a978d;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--text); font-family:'DM Sans',sans-serif; -webkit-font-smoothing:antialiased;}
  .topbar{position:sticky; top:0; z-index:20; display:flex; align-items:center; justify-content:space-between; padding:18px 20px; background:var(--bg); border-bottom:1px solid var(--border);}
  .topbar h1{font-size:19px; font-weight:900; margin:0; letter-spacing:-0.01em;}
  button{font-family:inherit; cursor:pointer; border:none; border-radius:10px; font-weight:700; font-size:14px; padding:10px 16px; transition:transform .08s ease, opacity .15s ease;}
  button:active{transform:scale(0.97);}
  .btn-primary{background:var(--accent); color:var(--accent-ink);}
  .btn-primary:hover{opacity:.88;}
  .btn-ghost{background:transparent; color:var(--text); border:1px solid var(--border);}
  .btn-ghost:hover{background:#ececea;}
  .icon-btn{width:38px; height:38px; padding:0; display:flex; align-items:center; justify-content:center; background:transparent; border:1px solid var(--border); border-radius:10px; font-size:16px;}

  .tabs{display:flex; gap:6px; padding:12px 20px; overflow-x:auto; -webkit-overflow-scrolling:touch; border-bottom:1px solid var(--border);}
  .tab{flex-shrink:0; padding:9px 16px; border-radius:100px; font-size:13.5px; font-weight:700; background:var(--card); border:1px solid var(--border); color:var(--muted); white-space:nowrap;}
  .tab.active{background:var(--text); color:#fff; border-color:var(--text);}

  .controls{display:flex; gap:10px; padding:14px 20px; flex-wrap:wrap;}
  .controls input{flex:1; min-width:180px; font-family:inherit; font-size:14px; padding:10px 12px; border:1px solid var(--border); border-radius:10px; background:var(--card); color:var(--text);}

  main{padding:4px 20px 60px;}
  .leads-grid{display:flex; flex-direction:column; gap:10px; max-width:760px; margin:0 auto;}
  .lead-card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:15px 17px; display:flex; align-items:center; gap:14px; cursor:pointer;}
  .lead-card:hover{border-color:#d3d2cb;}
  .lead-main{flex:1; min-width:0;}
  .lead-name-row{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .lead-rank{color:var(--muted); font-size:12px; font-weight:700;}
  .lead-name{font-weight:700; font-size:15px;}
  .status-pill{font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:100px; background:#eeeeeb; color:var(--muted); text-transform:uppercase; letter-spacing:.03em;}
  .lead-sub{color:var(--muted); font-size:12.5px; margin-top:2px;}
  .lead-note{margin-top:4px; font-size:13px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:480px;}
  .chip{flex-shrink:0; text-align:center; padding:7px 12px; border-radius:12px; font-weight:900; font-size:12.5px; min-width:78px;}
  .chip .days-num{display:block; font-size:16px; line-height:1.1;}
  .chip .days-label{display:block; font-size:9.5px; font-weight:700; text-transform:uppercase; opacity:.85; margin-top:1px;}
  .u-fresh{background:#eef6df; color:var(--fresh);}
  .u-warm{background:#faf0dc; color:var(--warm);}
  .u-stale{background:#fbe6e2; color:var(--stale);}
  .u-none{background:#efefec; color:var(--none);}
  .empty-state{text-align:center; padding:70px 20px; color:var(--muted);}
  .empty-state h2{color:var(--text); font-size:18px; margin-bottom:6px;}
  .empty-state p{font-size:14px; max-width:360px; margin:0 auto 18px;}

  .overlay{position:fixed; inset:0; background:rgba(20,20,15,0.4); display:none; align-items:flex-start; justify-content:center; padding:32px 16px; z-index:100; overflow-y:auto;}
  .overlay.open{display:flex;}
  .modal{background:var(--card); border-radius:var(--radius); padding:22px; width:100%; max-width:560px;}
  .modal h2{margin:0 0 4px; font-size:17px; font-weight:900;}
  .modal .modal-sub{color:var(--muted); font-size:12.5px; margin-bottom:16px;}
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:12px; font-weight:700; color:var(--muted); margin-bottom:5px;}
  .field input, .field select, .field textarea{width:100%; font-family:inherit; font-size:14px; padding:9px 11px; border:1px solid var(--border); border-radius:10px; background:var(--bg); color:var(--text);}
  .field textarea{resize:vertical; min-height:60px;}
  .field-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .field-group-label{font-size:11px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin:16px 0 8px; border-top:1px solid var(--border); padding-top:14px;}
  .field-group-label:first-child{margin-top:0; border-top:none; padding-top:0;}
  .modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:16px;}
  .history{border-top:1px solid var(--border); margin-top:16px; padding-top:14px;}
  .history h3{font-size:12px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; margin:0 0 10px;}
  .history-item{padding:9px 11px; border-radius:10px; background:var(--bg); font-size:13px; margin-bottom:8px; white-space:pre-wrap; line-height:1.45;}
  .detail-block{margin-bottom:14px;}
  .detail-block .dl-label{font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; margin-bottom:4px;}
  .detail-block .dl-value{font-size:14px;}
  .detail-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:14px;}
  .toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--text); color:#fff; padding:11px 18px; border-radius:10px; font-size:13.5px; font-weight:600; opacity:0; pointer-events:none; transition:opacity .2s ease; z-index:200;}
  .toast.show{opacity:1;}
</style>
</head>
<body>

<div class="topbar">
  <h1>Leadlist Overview</h1>
  <button class="icon-btn" id="settingsBtn" title="Configuración">⚙</button>
</div>

<div class="tabs" id="tabsBar"></div>

<div class="controls">
  <input type="text" id="searchInput" placeholder="Buscar cuenta o contacto...">
  <button class="btn-primary" id="newLeadBtn">+ Nuevo lead</button>
</div>

<main><div class="leads-grid" id="leadsGrid"></div></main>

<div class="toast" id="toast"></div>

<!-- Settings -->
<div class="overlay" id="settingsOverlay">
  <div class="modal">
    <h2>Configuración</h2>
    <div class="field"><label>URL del Apps Script (Web App)</label><input type="text" id="cfgUrl" placeholder="https://script.google.com/macros/s/.../exec"></div>
    <div class="field"><label>Token secreto</label><input type="text" id="cfgToken"></div>
    <div class="modal-actions">
      <button class="btn-ghost" data-close>Cancelar</button>
      <button class="btn-primary" id="saveSettingsBtn">Guardar y conectar</button>
    </div>
  </div>
</div>

<!-- Detail -->
<div class="overlay" id="detailOverlay">
  <div class="modal" style="max-width:560px;">
    <h2 id="detailName"></h2>
    <div class="modal-sub" id="detailMeta"></div>

    <div class="detail-grid">
      <div class="detail-block"><div class="dl-label">Contacto</div><div class="dl-value" id="dContact">—</div></div>
      <div class="detail-block"><div class="dl-label">Redes / Web</div><div class="dl-value" id="dLinks">—</div></div>
      <div class="detail-block"><div class="dl-label">Deal</div><div class="dl-value" id="dDeal">—</div></div>
    </div>

    <div style="display:flex; gap:8px;">
      <button class="btn-primary" id="logTouchpointFromDetailBtn" style="flex:1;">+ Registrar touchpoint</button>
      <button class="btn-ghost" id="editLeadBtn">Editar</button>
    </div>

    <div class="history">
      <h3>Historial (Comment)</h3>
      <div id="historyList"></div>
    </div>
    <div class="history" id="legacyNotesBlock" style="display:none;">
      <h3>Notas anteriores (Comments)</h3>
      <div class="history-item" id="legacyNotesText"></div>
    </div>
    <div class="modal-actions"><button class="btn-ghost" data-close>Cerrar</button></div>
  </div>
</div>

<!-- New / Edit lead -->
<div class="overlay" id="leadOverlay">
  <div class="modal">
    <h2 id="leadModalTitle">Nuevo lead</h2>
    <div class="modal-sub" id="leadModalSection"></div>

    <div class="field-group-label">Básico</div>
    <div class="field"><label>Account</label><input type="text" id="fAccount"></div>
    <div class="field-grid">
      <div class="field"><label>Status</label><input type="text" id="fStatus" list="statusList"></div>
      <div class="field"><label>Vertical</label><input type="text" id="fVertical"></div>
    </div>
    <div class="field-grid">
      <div class="field"><label>Location</label><input type="text" id="fLocation"></div>
      <div class="field"><label># Tickets potential</label><input type="text" id="fTickets"></div>
    </div>
    <div class="field"><label>Comment (nota inicial, opcional)</label><textarea id="fComment"></textarea></div>

    <div class="field-group-label">Contacto</div>
    <div class="field-grid">
      <div class="field"><label>Contact name</label><input type="text" id="fContactName"></div>
      <div class="field"><label>Phone</label><input type="text" id="fPhone"></div>
    </div>
    <div class="field-grid">
      <div class="field"><label>E-mail</label><input type="text" id="fEmail"></div>
      <div class="field"><label>Website</label><input type="text" id="fWebsite"></div>
    </div>
    <div class="field-grid">
      <div class="field"><label>Insta</label><input type="text" id="fInsta"></div>
      <div class="field"><label>Linkedin</label><input type="text" id="fLinkedin"></div>
    </div>

    <div class="field-group-label">Deal</div>
    <div class="field-grid">
      <div class="field"><label>Ticketdeal</label><input type="text" id="fTicketdeal"></div>
      <div class="field"><label>Ticketing Partner</label><input type="text" id="fTicketingPartner"></div>
    </div>

    <datalist id="statusList">
      <option value="Ready for outreach"></option>
      <option value="Waiting for response"></option>
      <option value="Prospect"></option>
      <option value="Convince for video meeting"></option>
      <option value="Lead enrichment"></option>
      <option value="(Video) Meeting set / Prep"></option>
      <option value="Don't want to switch ticketing provider"></option>
    </datalist>

    <div class="modal-actions">
      <button class="btn-ghost" data-close>Cancelar</button>
      <button class="btn-primary" id="saveLeadBtn">Guardar</button>
    </div>
  </div>
</div>

<!-- Log touchpoint -->
<div class="overlay" id="touchpointOverlay">
  <div class="modal">
    <h2>Registrar touchpoint</h2>
    <div class="field"><label>Fecha</label><input type="date" id="tFecha"></div>
    <div class="field">
      <label>Vía</label>
      <select id="tCanal">
        <option>WhatsApp</option><option>Email</option><option>Llamada</option>
        <option>Instagram</option><option>LinkedIn</option><option>Presencial</option><option>Otro</option>
      </select>
    </div>
    <div class="field"><label>Mensaje</label><textarea id="tMensaje" placeholder="Qué se habló..."></textarea></div>
    <div class="modal-actions">
      <button class="btn-ghost" data-close>Cancelar</button>
      <button class="btn-primary" id="saveTouchpointBtn">Guardar</button>
    </div>
  </div>
</div>

<script>
const CONFIG_KEY = 'leadlist_overview_config';
let config = JSON.parse(localStorage.getItem(CONFIG_KEY) || 'null');
let sections = [];
let activeSectionIdx = 0;
let activeLead = null;
let editingRow = null;

const $ = sel => document.querySelector(sel);
const grid = $('#leadsGrid');

function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2400); }
function openOverlay(id){ $(id).classList.add('open'); }
function closeOverlay(id){ $(id).classList.remove('open'); }
document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click', e=>e.target.closest('.overlay').classList.remove('open')));
document.querySelectorAll('.overlay').forEach(o=>o.addEventListener('click', e=>{ if(e.target===o) o.classList.remove('open'); }));

async function apiGet(){
  const res = await fetch(`${config.url}?token=${encodeURIComponent(config.token)}`);
  const json = await res.json();
  if (json.error) throw new Error(json.error);
  return json;
}
// Sin header Content-Type a propósito — evita el preflight CORS que
// Apps Script no maneja bien. El body llega como texto plano y
// doPost lo parsea igual con JSON.parse(e.postData.contents).
async function apiPost(action, data){
  const res = await fetch(config.url, { method:'POST', body: JSON.stringify({ token: config.token, action, data }) });
  const json = await res.json();
  if (json.error) throw new Error(json.error);
  return json;
}

async function loadData(){
  if (!config || !config.url || !config.token){ renderNotConfigured(); return; }
  try{
    const data = await apiGet();
    sections = data.sections || [];
    if (activeSectionIdx >= sections.length) activeSectionIdx = 0;
    renderTabs();
    render();
  }catch(err){
    grid.innerHTML = `<div class="empty-state"><h2>No se pudo conectar</h2><p>${err.message}</p></div>`;
  }
}

function renderNotConfigured(){
  $('#tabsBar').innerHTML = '';
  grid.innerHTML = `<div class="empty-state">
    <h2>Conecta tu Sheet</h2>
    <p>Abre configuración (⚙) y pega la URL de tu Apps Script y tu token.</p>
    <button class="btn-primary" onclick="openOverlay('#settingsOverlay')">Abrir configuración</button>
  </div>`;
}

function renderTabs(){
  $('#tabsBar').innerHTML = sections.map((s,i)=>
    `<button class="tab ${i===activeSectionIdx?'active':''}" data-idx="${i}">${escapeHtml(s.title)} <span style="opacity:.6">(${s.leads.length})</span></button>`
  ).join('');
  $('#tabsBar').querySelectorAll('.tab').forEach(t=>t.addEventListener('click', ()=>{
    activeSectionIdx = parseInt(t.dataset.idx); renderTabs(); render();
  }));
}

function daysSince(dateStr){
  if (!dateStr) return null;
  const d = new Date(dateStr);
  if (isNaN(d.getTime())) return null;
  return Math.floor((Date.now()-d.getTime())/86400000);
}
function urgency(days){
  if (days===null) return {cls:'u-none'};
  if (days<=6) return {cls:'u-fresh'};
  if (days<=13) return {cls:'u-warm'};
  return {cls:'u-stale'};
}

function render(){
  const sec = sections[activeSectionIdx];
  if (!sec){ grid.innerHTML = ''; return; }
  const search = $('#searchInput').value.trim().toLowerCase();

  let leads = sec.leads.filter(l =>
    !search || (l.account||'').toLowerCase().includes(search) || (l.contactName||'').toLowerCase().includes(search)
  );

  leads = [...leads].sort((a,b)=>{
    const da = daysSince(a.fecha), db = daysSince(b.fecha);
    if (da===null && db===null) return (a.rank||0)-(b.rank||0);
    if (da===null) return 1;
    if (db===null) return -1;
    return db-da;
  });

  if (leads.length===0){
    grid.innerHTML = `<div class="empty-state"><h2>Sin leads en esta sección</h2><p>Agrega el primero con "+ Nuevo lead".</p></div>`;
    return;
  }

  grid.innerHTML = leads.map(l=>{
    const days = daysSince(l.fecha);
    const u = urgency(days);
    const chipText = days===null ? '—' : days;
    const chipLabel = days===null ? 'sin fecha' : (days===1?'día':'días');
    const sub = [l.location, l.vertical].filter(Boolean).join(' · ');
    const noteSource = l.comment || l.comments || '';
    const notePreview = noteSource.split(' - ')[0];
    return `
      <div class="lead-card" data-row="${l.row}">
        <div class="lead-main">
          <div class="lead-name-row">
            ${l.rank ? `<span class="lead-rank">#${escapeHtml(String(l.rank))}</span>` : ''}
            <span class="lead-name">${escapeHtml(l.account||'(sin nombre)')}</span>
            ${l.status ? `<span class="status-pill">${escapeHtml(l.status)}</span>` : ''}
          </div>
          ${sub ? `<div class="lead-sub">${escapeHtml(sub)}</div>` : ''}
          ${notePreview ? `<div class="lead-note">${escapeHtml(notePreview)}</div>` : ''}
        </div>
        <div class="chip ${u.cls}"><span class="days-num">${chipText}</span><span class="days-label">${chipLabel}</span></div>
      </div>`;
  }).join('');

  grid.querySelectorAll('.lead-card').forEach(card=>{
    card.addEventListener('click', ()=>openDetail(parseInt(card.dataset.row)));
  });
}

function escapeHtml(str){ return String(str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

function findLead(row){
  for (const s of sections){ const l = s.leads.find(x=>x.row===row); if (l) return l; }
  return null;
}

function openDetail(row){
  const l = findLead(row);
  if (!l) return;
  activeLead = l;
  $('#detailName').textContent = l.account || '(sin nombre)';
  $('#detailMeta').textContent = [l.status, l.location, l.vertical].filter(Boolean).join(' · ');

  $('#dContact').innerHTML = [
    l.contactName ? escapeHtml(l.contactName) : '',
    l.phone ? escapeHtml(l.phone) : '',
    l.email ? escapeHtml(l.email) : ''
  ].filter(Boolean).join('<br>') || '—';

  $('#dLinks').innerHTML = [
    l.website ? `<a href="${escapeHtml(l.website)}" target="_blank" rel="noopener">Website</a>` : '',
    l.insta ? `<a href="${escapeHtml(l.insta)}" target="_blank" rel="noopener">Instagram</a>` : '',
    l.linkedin ? `<a href="${escapeHtml(l.linkedin)}" target="_blank" rel="noopener">LinkedIn</a>` : ''
  ].filter(Boolean).join('<br>') || '—';

  $('#dDeal').innerHTML = [
    l.ticketdeal ? 'Ticketdeal: ' + escapeHtml(l.ticketdeal) : '',
    l.tickets ? '# Tickets: ' + escapeHtml(String(l.tickets)) : '',
    l.ticketingPartner ? 'Partner actual: ' + escapeHtml(l.ticketingPartner) : ''
  ].filter(Boolean).join('<br>') || '—';

  const list = $('#historyList');
  if (!l.comment){
    list.innerHTML = `<p style="color:var(--muted); font-size:13px;">Sin historial todavía.</p>`;
  } else {
    const entries = String(l.comment).split(' - ').map(s=>s.trim()).filter(Boolean);
    list.innerHTML = entries.map(e=>`<div class="history-item">${escapeHtml(e)}</div>`).join('');
  }

  const legacyBlock = $('#legacyNotesBlock');
  if (l.comments){
    $('#legacyNotesText').textContent = l.comments;
    legacyBlock.style.display = '';
  } else {
    legacyBlock.style.display = 'none';
  }

  openOverlay('#detailOverlay');
}

// ---- settings ----
$('#settingsBtn').addEventListener('click', ()=>{
  if (config){ $('#cfgUrl').value=config.url||''; $('#cfgToken').value=config.token||''; }
  openOverlay('#settingsOverlay');
});
$('#saveSettingsBtn').addEventListener('click', ()=>{
  const url = $('#cfgUrl').value.trim(), token = $('#cfgToken').value.trim();
  if (!url || !token){ toast('Falta la URL o el token'); return; }
  config = { url, token };
  localStorage.setItem(CONFIG_KEY, JSON.stringify(config));
  closeOverlay('#settingsOverlay');
  loadData();
});

// ---- new / edit lead ----
function clearLeadForm(){
  ['fAccount','fStatus','fVertical','fLocation','fTickets','fComment','fContactName','fPhone','fEmail','fWebsite','fInsta','fLinkedin','fTicketdeal','fTicketingPartner']
    .forEach(id=>$('#'+id).value='');
}

$('#newLeadBtn').addEventListener('click', ()=>{
  if (!sections[activeSectionIdx]){ toast('No hay sección activa'); return; }
  editingRow = null;
  clearLeadForm();
  $('#leadModalTitle').textContent = 'Nuevo lead';
  $('#leadModalSection').textContent = 'Sección: ' + sections[activeSectionIdx].title;
  openOverlay('#leadOverlay');
});

$('#editLeadBtn').addEventListener('click', ()=>{
  if (!activeLead) return;
  editingRow = activeLead.row;
  clearLeadForm();
  $('#fAccount').value = activeLead.account||'';
  $('#fStatus').value = activeLead.status||'';
  $('#fVertical').value = activeLead.vertical||'';
  $('#fLocation').value = activeLead.location||'';
  $('#fTickets').value = activeLead.tickets||'';
  $('#fComment').value = activeLead.comment||'';
  $('#fContactName').value = activeLead.contactName||'';
  $('#fPhone').value = activeLead.phone||'';
  $('#fEmail').value = activeLead.email||'';
  $('#fWebsite').value = activeLead.website||'';
  $('#fInsta').value = activeLead.insta||'';
  $('#fLinkedin').value = activeLead.linkedin||'';
  $('#fTicketdeal').value = activeLead.ticketdeal||'';
  $('#fTicketingPartner').value = activeLead.ticketingPartner||'';
  $('#leadModalTitle').textContent = 'Editar lead';
  $('#leadModalSection').textContent = activeLead.account;
  closeOverlay('#detailOverlay');
  openOverlay('#leadOverlay');
});

$('#saveLeadBtn').addEventListener('click', async ()=>{
  const account = $('#fAccount').value.trim();
  if (!account){ toast('Ponle un nombre de cuenta'); return; }
  const fields = {
    account, status: $('#fStatus').value.trim(), vertical: $('#fVertical').value.trim(),
    location: $('#fLocation').value.trim(), tickets: $('#fTickets').value.trim(),
    comment: $('#fComment').value.trim(), contactName: $('#fContactName').value.trim(),
    phone: $('#fPhone').value.trim(), email: $('#fEmail').value.trim(),
    website: $('#fWebsite').value.trim(), insta: $('#fInsta').value.trim(),
    linkedin: $('#fLinkedin').value.trim(), ticketdeal: $('#fTicketdeal').value.trim(),
    ticketingPartner: $('#fTicketingPartner').value.trim()
  };
  try{
    if (editingRow){
      await apiPost('updateLead', { row: editingRow, expectedAccount: activeLead.account, fields });
      toast('Lead actualizado');
    } else {
      await apiPost('addLead', { sectionHeaderRow: sections[activeSectionIdx].headerRow, data: fields });
      toast('Lead agregado');
    }
    closeOverlay('#leadOverlay');
    loadData();
  }catch(err){ toast('Error: '+err.message); }
});

// ---- touchpoint ----
$('#logTouchpointFromDetailBtn').addEventListener('click', ()=>{
  $('#tFecha').value = new Date().toISOString().slice(0,10);
  $('#tCanal').value = 'WhatsApp';
  $('#tMensaje').value = '';
  openOverlay('#touchpointOverlay');
});

$('#saveTouchpointBtn').addEventListener('click', async ()=>{
  if (!activeLead) return;
  const fecha = $('#tFecha').value, canal = $('#tCanal').value, mensaje = $('#tMensaje').value.trim();
  if (!fecha){ toast('Ponle una fecha'); return; }
  try{
    await apiPost('logTouchpoint', { row: activeLead.row, expectedAccount: activeLead.account, fecha, canal, mensaje });
    closeOverlay('#touchpointOverlay');
    closeOverlay('#detailOverlay');
    toast('Touchpoint registrado');
    loadData();
  }catch(err){ toast('Error: '+err.message); }
});

$('#searchInput').addEventListener('input', render);

loadData();
</script>
</body>
</html>
