
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  .app { padding: 1rem 0; font-family: var(--font-sans); }
  .toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 12px; }
  .toolbar h1 { font-size: 18px; font-weight: 500; color: var(--color-text-primary); }
  .btn { font-size: 13px; font-weight: 500; padding: 7px 14px; border-radius: var(--border-radius-md); border: 0.5px solid var(--color-border-secondary); background: var(--color-background-primary); color: var(--color-text-primary); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  .btn:hover { background: var(--color-background-secondary); }
  .btn-primary { background: var(--color-text-primary); color: var(--color-background-primary); border-color: transparent; }
  .btn-primary:hover { opacity: 0.85; }
  .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 16px; }
  .look-card { background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); overflow: hidden; display: flex; flex-direction: column; }
  .card-header { padding: 12px 14px 8px; border-bottom: 0.5px solid var(--color-border-tertiary); display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .card-brand { font-size: 15px; font-weight: 500; color: var(--color-text-primary); }
  .card-look-num { font-size: 11px; color: var(--color-text-secondary); background: var(--color-background-secondary); padding: 2px 8px; border-radius: 20px; border: 0.5px solid var(--color-border-tertiary); white-space: nowrap; flex-shrink: 0; }
  .card-photo { width: 100%; aspect-ratio: 3/4; background: var(--color-background-secondary); border-bottom: 0.5px solid var(--color-border-tertiary); display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative; overflow: hidden; }
  .card-photo img { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; }
  .card-photo .photo-placeholder { display: flex; flex-direction: column; align-items: center; gap: 8px; color: var(--color-text-tertiary); font-size: 12px; }
  .card-photo input[type=file] { display: none; }
  .card-body { padding: 10px 14px; flex: 1; display: flex; flex-direction: column; gap: 5px; }
  .field-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .field-label { font-size: 11px; color: var(--color-text-tertiary); text-transform: uppercase; letter-spacing: 0.04em; white-space: nowrap; flex-shrink: 0; }
  .field-val { font-size: 12px; color: var(--color-text-primary); text-align: right; }
  .storytelling-block { margin-top: 6px; padding-top: 6px; border-top: 0.5px solid var(--color-border-tertiary); }
  .storytelling-text { font-size: 11px; color: var(--color-text-secondary); font-style: italic; line-height: 1.6; }
  .card-footer { padding: 8px 14px; border-top: 0.5px solid var(--color-border-tertiary); display: flex; gap: 6px; justify-content: flex-end; }
  .btn-sm { font-size: 12px; padding: 4px 10px; border-radius: var(--border-radius-md); border: 0.5px solid var(--color-border-secondary); background: var(--color-background-primary); color: var(--color-text-secondary); cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
  .btn-sm:hover { background: var(--color-background-secondary); color: var(--color-text-primary); }
  .btn-sm.danger:hover { color: #a32d2d; border-color: #a32d2d; }
  .empty-state { text-align: center; padding: 3rem 1rem; color: var(--color-text-secondary); font-size: 14px; grid-column: 1/-1; }
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 100; display: flex; align-items: flex-start; justify-content: center; padding: 2rem 1rem; overflow-y: auto; }
  .modal { background: var(--color-background-primary); border-radius: var(--border-radius-lg); border: 0.5px solid var(--color-border-secondary); padding: 1.5rem; width: 100%; max-width: 520px; }
  .modal h2 { font-size: 16px; font-weight: 500; margin-bottom: 1.25rem; color: var(--color-text-primary); }
  .section-divider { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--color-text-tertiary); margin: 14px 0 10px; padding-bottom: 4px; border-bottom: 0.5px solid var(--color-border-tertiary); grid-column: 1/-1; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .form-group { display: flex; flex-direction: column; gap: 4px; }
  .form-group.full { grid-column: 1 / -1; }
  .form-group label { font-size: 12px; color: var(--color-text-secondary); }
  .form-group input, .form-group select, .form-group textarea { font-size: 13px; padding: 7px 10px; border-radius: var(--border-radius-md); border: 0.5px solid var(--color-border-secondary); background: var(--color-background-primary); color: var(--color-text-primary); font-family: var(--font-sans); width: 100%; }
  .form-group textarea { resize: vertical; min-height: 80px; line-height: 1.6; }
  .modal-footer { margin-top: 1.25rem; display: flex; justify-content: flex-end; gap: 8px; }
  .season-badge { font-size: 11px; font-weight: 500; padding: 2px 7px; border-radius: 20px; }
  .ss { background: #EAF3DE; color: #3B6D11; border: 0.5px solid #97C459; }
  .aw { background: #E6F1FB; color: #185FA5; border: 0.5px solid #85B7EB; }
  .resort { background: #FAEEDA; color: #854F0B; border: 0.5px solid #EF9F27; }
  .prefall { background: #EEEDFE; color: #534AB7; border: 0.5px solid #AFA9EC; }
  .cond-badge { font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 20px; }
  .cond-deadstock { background: #0A0A0A; color: #C4FF00; }
  .cond-nwt { background: #EAF3DE; color: #3B6D11; border: 0.5px solid #97C459; }
  .cond-excellent { background: #E6F1FB; color: #185FA5; border: 0.5px solid #85B7EB; }
  .cond-verygood { background: #EEEDFE; color: #534AB7; border: 0.5px solid #AFA9EC; }
  .cond-good { background: #FAEEDA; color: #854F0B; border: 0.5px solid #EF9F27; }
  .cond-fair { background: #FAECE7; color: #993C1D; border: 0.5px solid #F0997B; }
  .hidden { display: none; }
  .ai-btn { font-size: 11px; padding: 4px 10px; border-radius: var(--border-radius-md); border: 0.5px solid var(--color-border-secondary); background: var(--color-background-secondary); color: var(--color-text-secondary); cursor: pointer; display: inline-flex; align-items: center; gap: 5px; margin-top: 4px; }
  .ai-btn:hover { color: var(--color-text-primary); }
  .ai-loading { font-size: 11px; color: var(--color-text-tertiary); font-style: italic; margin-top: 4px; }
</style>

<div class="app">
  <div class="toolbar">
    <h1><i class="ti ti-layout-cards" aria-hidden="true"></i> Look cards</h1>
    <button class="btn btn-primary" onclick="openModal()"><i class="ti ti-plus" aria-hidden="true"></i> Add look</button>
  </div>
  <div class="cards-grid" id="cardsGrid"></div>
</div>

<div class="modal-bg hidden" id="modalBg">
  <div class="modal">
    <h2 id="modalTitle">New look</h2>
    <div class="form-grid">

      <div class="section-divider">Identity</div>

      <div class="form-group full">
        <label>Brand name *</label>
        <input type="text" id="f-brand" placeholder="e.g. Maison Margiela">
      </div>
      <div class="form-group">
        <label>Look #</label>
        <input type="text" id="f-look" placeholder="e.g. 18">
      </div>
      <div class="form-group">
        <label>Collection # (official)</label>
        <input type="text" id="f-collnum" placeholder="e.g. Collection 6">
      </div>
      <div class="form-group">
        <label>Season</label>
        <select id="f-season">
          <option value="SS">SS — Spring/Summer</option>
          <option value="AW">AW — Autumn/Winter</option>
          <option value="Resort">Resort</option>
          <option value="Pre-Fall">Pre-Fall</option>
        </select>
      </div>
      <div class="form-group">
        <label>Year</label>
        <input type="text" id="f-year" placeholder="e.g. 1998">
      </div>
      <div class="form-group">
        <label>Country of origin</label>
        <input type="text" id="f-country" placeholder="e.g. France">
      </div>
      <div class="form-group">
        <label>Model name</label>
        <input type="text" id="f-model" placeholder="e.g. Amara Nwosu">
      </div>

      <div class="section-divider">Garment</div>

      <div class="form-group">
        <label>Size</label>
        <input type="text" id="f-size" placeholder="e.g. 36 / XS">
      </div>
      <div class="form-group">
        <label>Retail price</label>
        <input type="text" id="f-price" placeholder="e.g. €2,400">
      </div>
      <div class="form-group full">
        <label>Accessories (shoes, bag, jewelry)</label>
        <input type="text" id="f-accessories" placeholder="e.g. Leather mules 39, gold chain bag">
      </div>
      <div class="form-group full">
        <label>Hair &amp; makeup ref</label>
        <input type="text" id="f-hmu" placeholder="e.g. Slicked back, nude lip">
      </div>

      <div class="section-divider">Condition</div>

      <div class="form-group full">
        <label>Estado de conservación</label>
        <select id="f-condition">
          <option value="">— Select —</option>
          <option value="Deadstock">Deadstock</option>
          <option value="New with tags">New with tags</option>
          <option value="Excellent">Excellent</option>
          <option value="Very Good">Very Good</option>
          <option value="Good">Good</option>
          <option value="Fair">Fair</option>
        </select>
      </div>

      <div class="section-divider">Storytelling</div>

      <div class="form-group full">
        <label>Editorial description</label>
        <textarea id="f-story" placeholder="e.g. Tailored black wool coat from the Fall/Winter 1998 collection by Martin Margiela. Featuring exaggerated shoulders and signature deconstruction details emblematic of the designer's late-90s work. Seen on the runway in Look 18."></textarea>
        <button class="ai-btn" onclick="generateStorytelling()" id="ai-btn"><i class="ti ti-sparkles" aria-hidden="true"></i> Generate with AI</button>
        <span class="ai-loading hidden" id="ai-loading">Writing editorial copy…</span>
      </div>

      <div class="section-divider">Backstage notes</div>

      <div class="form-group full">
        <label>Dresser / stylist notes</label>
        <textarea id="f-notes" placeholder="e.g. Zipper at back — do last, model changes in under 60s"></textarea>
      </div>

    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveCard()">Save look</button>
    </div>
  </div>
</div>

<script>
let cards = [];
let editingId = null;

const conditionClass = {
  'Deadstock': 'cond-deadstock',
  'New with tags': 'cond-nwt',
  'Excellent': 'cond-excellent',
  'Very Good': 'cond-verygood',
  'Good': 'cond-good',
  'Fair': 'cond-fair'
};

const seasonClass = { 'SS':'ss','AW':'aw','Resort':'resort','Pre-Fall':'prefall' };

const FIELDS = ['brand','look','collnum','season','year','country','model','size','price','accessories','hmu','condition','story','notes'];

function openModal(id) {
  editingId = id || null;
  document.getElementById('modalTitle').textContent = id ? 'Edit look' : 'New look';
  if (id) {
    const c = cards.find(x => x.id === id);
    FIELDS.forEach(f => { const el = document.getElementById('f-'+f); if (el) el.value = c[f] || ''; });
  } else {
    FIELDS.forEach(f => { const el = document.getElementById('f-'+f); if (el) el.value = ''; });
    document.getElementById('f-season').value = 'AW';
    document.getElementById('f-year').value = '';
  }
  document.getElementById('modalBg').classList.remove('hidden');
}

function closeModal() {
  document.getElementById('modalBg').classList.add('hidden');
  editingId = null;
}

function saveCard() {
  const brand = document.getElementById('f-brand').value.trim();
  if (!brand) { alert('Brand name is required.'); return; }
  const data = { id: editingId || Date.now(), photo: editingId ? (cards.find(x=>x.id===editingId)?.photo||null) : null };
  FIELDS.forEach(f => { const el = document.getElementById('f-'+f); data[f] = el ? el.value.trim() : ''; });
  if (editingId) { cards = cards.map(c => c.id === editingId ? data : c); }
  else { cards.push(data); }
  renderCards();
  closeModal();
}

function deleteCard(id) {
  if (!confirm('Remove this look card?')) return;
  cards = cards.filter(c => c.id !== id);
  renderCards();
}

function triggerPhotoUpload(id) { document.getElementById('photo-input-'+id).click(); }

function handlePhoto(id, input) {
  const file = input.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = e => { cards = cards.map(c => c.id===id ? {...c, photo: e.target.result} : c); renderCards(); };
  reader.readAsDataURL(file);
}

async function generateStorytelling() {
  const brand = document.getElementById('f-brand').value.trim();
  const season = document.getElementById('f-season').value;
  const year = document.getElementById('f-year').value.trim();
  const look = document.getElementById('f-look').value.trim();
  const collnum = document.getElementById('f-collnum').value.trim();
  const country = document.getElementById('f-country').value.trim();
  const size = document.getElementById('f-size').value.trim();
  const condition = document.getElementById('f-condition').value;

  if (!brand) { alert('Add the brand name first.'); return; }

  document.getElementById('ai-btn').classList.add('hidden');
  document.getElementById('ai-loading').classList.remove('hidden');

  const prompt = `Write a short, elegant editorial description for a vintage fashion piece for a look card used at a luxury vintage fashion sale or showroom. 
Details:
- Brand: ${brand}
- Season: ${season} ${year}
${collnum ? '- Official collection: ' + collnum : ''}
${look ? '- Look number: ' + look : ''}
${country ? '- Country of origin: ' + country : ''}
${size ? '- Size: ' + size : ''}
${condition ? '- Condition: ' + condition : ''}

Write 2-4 sentences max. Tone: editorial, precise, evocative — like a high-end auction house or archive store. Mention the season, any signature design codes of the house if known, and what makes it collectible. No marketing fluff. Output only the description text, no quotes, no labels.`;

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 1000,
        messages: [{ role: 'user', content: prompt }]
      })
    });
    const data = await res.json();
    const text = data.content?.find(b => b.type === 'text')?.text || '';
    document.getElementById('f-story').value = text.trim();
  } catch(e) {
    alert('Could not generate. Try again.');
  }

  document.getElementById('ai-btn').classList.remove('hidden');
  document.getElementById('ai-loading').classList.add('hidden');
}

function exportPDF(id) {
  const c = cards.find(x => x.id === id);
  if (!c) return;
  if (typeof window.jspdf === 'undefined') { alert('PDF library still loading, try again in a moment.'); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a5' });
  const W = 148, H = 210;
  doc.setFillColor(255,255,255); doc.rect(0,0,W,H,'F');
  doc.setDrawColor(220,220,220); doc.rect(4,4,W-8,H-8,'S');

  doc.setFont('helvetica','bold'); doc.setFontSize(15); doc.setTextColor(15,15,15);
  doc.text(c.brand.toUpperCase(), W/2, 15, { align: 'center' });

  let subY = 20;
  const subs = [];
  if (c.collnum) subs.push(c.collnum);
  if (c.season || c.year) subs.push((c.season||'') + (c.year ? ' '+c.year : ''));
  if (subs.length) {
    doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(120,120,120);
    doc.text(subs.join('  ·  '), W/2, subY, { align: 'center' });
    subY += 4;
  }
  if (c.look) {
    doc.setFontSize(8); doc.setTextColor(160,160,160);
    doc.text('Look ' + c.look, W/2, subY+1, { align: 'center' });
    subY += 4;
  }

  let photoEndY = subY + 4;
  if (c.photo) {
    try {
      const imgW = 55, imgH = 73, imgX = (W-imgW)/2;
      doc.addImage(c.photo, 'JPEG', imgX, photoEndY, imgW, imgH);
      photoEndY += imgH + 4;
    } catch(e) { photoEndY += 4; }
  } else {
    doc.setDrawColor(210,210,210); doc.setFillColor(248,248,248);
    doc.rect(46, photoEndY, 56, 72, 'FD');
    doc.setFontSize(7); doc.setTextColor(190,190,190);
    doc.text('photo', W/2, photoEndY+38, { align: 'center' });
    photoEndY += 76;
  }

  doc.setDrawColor(220,220,220); doc.line(10, photoEndY, W-10, photoEndY); photoEndY += 5;

  const rows = [
    ['Size', c.size], ['Price', c.price], ['Country', c.country],
    ['Condition', c.condition], ['Model', c.model],
    ['Accessories', c.accessories], ['Hair & MU', c.hmu]
  ].filter(r => r[1]);

  let y = photoEndY;
  rows.forEach(([label, val]) => {
    if (y > H - 30) return;
    doc.setFont('helvetica','bold'); doc.setFontSize(6.5); doc.setTextColor(140,140,140);
    doc.text(label.toUpperCase(), 10, y);
    doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(25,25,25);
    const lines = doc.splitTextToSize(val, W-52);
    doc.text(lines[0], W-10, y, { align: 'right' });
    y += 5.5;
  });

  if (c.story && y < H - 20) {
    doc.setDrawColor(220,220,220); doc.line(10, y+1, W-10, y+1); y += 6;
    doc.setFont('helvetica','bolditalic'); doc.setFontSize(6.5); doc.setTextColor(120,120,120);
    doc.text('STORYTELLING', 10, y); y += 4;
    doc.setFont('helvetica','italic'); doc.setFontSize(7); doc.setTextColor(50,50,50);
    const storyLines = doc.splitTextToSize(c.story, W-20);
    storyLines.slice(0, 6).forEach(line => { if (y < H-12) { doc.text(line, 10, y); y += 4.5; } });
  }

  doc.setFont('helvetica','normal'); doc.setFontSize(6.5); doc.setTextColor(190,190,190);
  doc.text('backstage', W/2, H-6, { align: 'center' });

  doc.save((c.brand+'_look'+(c.look||'')+'_'+c.season+(c.year||'')+'.pdf').replace(/\s+/g,'_'));
}

function renderCards() {
  const grid = document.getElementById('cardsGrid');
  grid.innerHTML = '';
  if (!cards.length) {
    grid.innerHTML = '<div class="empty-state"><i class="ti ti-hanger" style="font-size:32px;display:block;margin-bottom:8px;color:var(--color-text-tertiary)" aria-hidden="true"></i>No looks yet. Add your first card.</div>';
    return;
  }
  cards.forEach(c => {
    const sc = seasonClass[c.season] || 'ss';
    const cc = conditionClass[c.condition] || '';
    const div = document.createElement('div');
    div.className = 'look-card';
    div.innerHTML = `
      <div class="card-header">
        <div>
          <div class="card-brand">${c.brand}</div>
          <div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:4px;align-items:center">
            ${c.season||c.year ? `<span class="season-badge ${sc}">${c.season||''}${c.year?' '+c.year:''}</span>` : ''}
            ${c.collnum ? `<span style="font-size:11px;color:var(--color-text-tertiary)">${c.collnum}</span>` : ''}
            ${c.country ? `<span style="font-size:11px;color:var(--color-text-tertiary)">· ${c.country}</span>` : ''}
          </div>
        </div>
        ${c.look ? `<span class="card-look-num">Look ${c.look}</span>` : ''}
      </div>
      <div class="card-photo" onclick="triggerPhotoUpload(${c.id})">
        ${c.photo ? `<img src="${c.photo}" alt="Look photo">` : `<div class="photo-placeholder"><i class="ti ti-camera" style="font-size:28px" aria-hidden="true"></i><span>Tap to add photo</span></div>`}
        <input type="file" accept="image/*" id="photo-input-${c.id}" onchange="handlePhoto(${c.id},this)">
      </div>
      <div class="card-body">
        ${c.condition ? `<div class="field-row"><span class="field-label">Condition</span><span class="cond-badge ${cc}">${c.condition}</span></div>` : ''}
        ${c.size ? `<div class="field-row"><span class="field-label">Size</span><span class="field-val">${c.size}</span></div>` : ''}
        ${c.price ? `<div class="field-row"><span class="field-label">Price</span><span class="field-val" style="font-weight:500">${c.price}</span></div>` : ''}
        ${c.model ? `<div class="field-row"><span class="field-label">Model</span><span class="field-val">${c.model}</span></div>` : ''}
        ${c.accessories ? `<div class="field-row"><span class="field-label">Accessories</span><span class="field-val" style="font-size:11px">${c.accessories}</span></div>` : ''}
        ${c.hmu ? `<div class="field-row"><span class="field-label">Hair & MU</span><span class="field-val" style="font-size:11px">${c.hmu}</span></div>` : ''}
        ${c.notes ? `<div style="margin-top:4px"><div class="field-label" style="margin-bottom:2px">Notes</div><div style="font-size:11px;color:var(--color-text-secondary);font-style:italic">${c.notes}</div></div>` : ''}
        ${c.story ? `<div class="storytelling-block"><div class="field-label" style="margin-bottom:3px">Storytelling</div><div class="storytelling-text">${c.story}</div></div>` : ''}
      </div>
      <div class="card-footer">
        <button class="btn-sm" onclick="openModal(${c.id})"><i class="ti ti-edit" aria-hidden="true"></i> Edit</button>
        <button class="btn-sm" onclick="exportPDF(${c.id})"><i class="ti ti-download" aria-hidden="true"></i> PDF</button>
        <button class="btn-sm danger" onclick="deleteCard(${c.id})"><i class="ti ti-trash" aria-hidden="true"></i></button>
      </div>`;
    grid.appendChild(div);
  });
}

renderCards();
document.getElementById('modalBg').addEventListener('click', function(e) { if (e.target===this) closeModal(); });
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
